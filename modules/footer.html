    <div id="toast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 transform translate-y-20 opacity-0 transition-all duration-300 z-[100] pointer-events-none w-[90%] sm:w-auto max-w-sm">
        <div
            class="bg-gray-900/95 dark:bg-[#212121] border border-gray-700 dark:border-[#333333] backdrop-blur-xl text-white px-4 py-3 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] flex items-center gap-3">
            <div
                class="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0">
                <i class="fa-solid fa-check"></i>
            </div>
            <div class="flex flex-col min-w-0">
                <span id="toastTitle" class="font-bold text-sm tracking-tight truncate">Copied!</span>
                <span id="toastMsg" class="text-xs text-gray-400 truncate">Source code placed in clipboard.</span>
            </div>
        </div>
    </div>
    <textarea id="copyFallback" class="absolute -left-[9999px] top-0 opacity-0 w-1 h-1 pointer-events-none"
        aria-hidden="true" tabindex="-1"></textarea>

    <!-- Diagram Modal -->
    <div id="diagramModal" class="fixed inset-0 z-[110] bg-black/60 backdrop-blur-sm hidden flex items-center justify-center transition-opacity opacity-0">
        <div class="bg-white dark:bg-[#1a1a1a] rounded-xl shadow-2xl w-[95%] max-w-4xl max-h-[90vh] flex flex-col overflow-hidden relative transform scale-95 transition-transform duration-300 border border-gray-200 dark:border-[#333]">
            <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-[#333] shrink-0 bg-gray-50 dark:bg-[#111]">
                <h3 class="font-bold text-gray-800 dark:text-white flex items-center gap-2"><i class="fa-solid fa-flask text-primary"></i> Algorithm Logic</h3>
                <div class="flex items-center gap-2">
                    <button id="dlPngBtn" class="px-3 py-1.5 bg-primary/10 hover:bg-primary/20 text-primary text-xs font-bold rounded-md transition-colors border border-primary/20 focus:outline-none flex items-center gap-2">
                        <i class="fa-solid fa-camera"></i> Save PNG
                    </button>
                    <button id="closeDiagramBtn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-black/10 dark:hover:bg-white/10 text-gray-500 transition-colors focus:outline-none">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div class="p-4 sm:p-8 overflow-y-auto bg-gray-100 dark:bg-black/50 custom-scrollbar flex-1 flex flex-col items-center">
                <div id="diagramRenderCtx" class="w-full h-full flex items-center justify-center relative bg-white dark:bg-[#1a1a1a] rounded-lg">
                    <!-- Diagram content rendered here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
