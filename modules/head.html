<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>C++ Program Library | BioAlign-Pro Edit</title>
    <meta name="description" content="A comprehensive C++ Program Library">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Fira Code', 'monospace'] },
                    colors: { primary: '#0ea5e9', secondary: '#2563eb' }
                }
            }
        }
    </script>
    <style>
        .custom-resize {
            resize: vertical;
            overflow: hidden;
            min-height: 80px;
            max-height: 80vh;
        }
    </style>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body
    class="bg-gray-50 dark:bg-[#0f0f0f] text-gray-900 dark:text-gray-100 font-sans h-screen flex flex-col overflow-hidden m-0 p-0 transition-colors duration-300">

        class="fixed inset-0 z-[-10] w-full h-full pointer-events-none opacity-[0.12] dark:opacity-20"></canvas>
